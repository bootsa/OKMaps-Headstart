name: CI

on:
  push:
    branches:
      - "**"

jobs:
  test:
    name: Type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check (Biome)
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm typecheck

      - name: Tests with coverage (every package)
        run: pnpm coverage

      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mts >> "$GITHUB_STEP_SUMMARY"

      - name: Build Storybook
        run: pnpm --filter @okmaps/ui-svelte build-storybook

  browser:
    name: Build and browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @okmaps/frontend exec playwright install --with-deps chromium

      - name: Build the app
        run: pnpm build
        env:
          VITE_GATEWAY_URL: https://gateway.test

      - name: Browser test
        run: pnpm test:browser

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-screenshots
          path: apps/frontend/test-results/
          if-no-files-found: ignore
