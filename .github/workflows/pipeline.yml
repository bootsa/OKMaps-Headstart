name: Pipeline CI

on:
  push:
    branches:
      - "**"
    paths:
      - "packages/pipeline/**"
      - "packages/sources/**"
      - "packages/gateway/**"
      - "packages/app/**"
      - "server/workers/tests/knowncases/**"
      - ".github/workflows/pipeline.yml"

jobs:
  test:
    name: TypeScript ${{ matrix.package }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [pipeline, sources, gateway, app]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
