<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Knowledge Maps</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet" />
    <link rel="stylesheet" href="/src/map.css" />
  </head>
  <body class="vis">
    <nav class="toolbar">
      <div id="share-panel" class="share-panel" hidden>
        <input id="share-url" readonly aria-label="Share link" />
        <button id="copy" type="button">Copy</button>
      </div>
      <button id="share" type="button" hidden>Share</button>
      <button id="save" type="button" hidden>Save to my maps</button>
      <a href="./">← Search and your maps</a>
    </nav>
    <p id="message" class="message" hidden></p>
    <div class="overflow-vis">
      <div id="visualization" style="background-color: white"></div>
    </div>
    <script type="module" src="/src/map-page.ts"></script>
  </body>
</html>
