name: Frontend CI

on:
  push:
    branches:
      - "**"

jobs:
  test:
    name: Visualisation tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # The lockfile was made on macOS and lacks Linux's optional native
      # packages (npm/cli#4828), so install without it.
      - name: Install project dependencies
        run: rm package-lock.json && npm install --no-audit --no-fund

      - name: Run tests
        run: npm test -- --run

      - name: Build the visualisation
        run: npx webpack --mode=production
