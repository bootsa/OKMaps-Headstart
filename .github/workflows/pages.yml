name: GitHub Pages

# Builds the browser app (packages/app) with the visualisation and publishes
# it to GitHub Pages at https://<owner>.github.io/<repository>/:
#   latest/   the default branch
#   v1.2.0/   each release tag v* (newest 20; repository variable PAGES_MAX_VERSIONS),
#             built once and then kept in the Actions cache
# The site root sends visitors to latest/ and versions.html lists them all.
# See .github/scripts/build-pages.sh.
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   GATEWAY_URL      the gateway's URL; without it BASE searches and share links are off
#   CROSSREF_MAILTO  contact address for Crossref's polite pool (optional)

on:
  push:
    branches: [main]
    # A new release tag adds its version (path filters do not apply to tags).
    tags: ["v*"]
    paths:
      - "packages/**"
      - "vis/**"
      - "package.json"
      - "package-lock.json"
      - "webpack.config.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Called by release.yml when release-please has made a release.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The default branch and every tag, whatever triggered the run.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/app/package-lock.json

      # Earlier builds of releases (a release never changes; see build-pages.sh).
      - name: Restore release builds
        uses: actions/cache/restore@v4
        with:
          path: .pages-cache
          key: pages-releases-none
          restore-keys: pages-releases-

      - name: Build latest and every new release
        env:
          PAGES_CACHE: .pages-cache
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VITE_GATEWAY_URL: ${{ vars.GATEWAY_URL }}
          VITE_CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          PAGES_MAX_VERSIONS: ${{ vars.PAGES_MAX_VERSIONS }}
        run: .github/scripts/build-pages.sh "${{ github.event.repository.name }}" _site

      # Named after what it holds, so an unchanged set is not saved again.
      - name: Name the release builds
        id: releases
        run: echo "key=pages-releases-$(cat .pages-cache/*/.stamp 2>/dev/null | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Keep release builds for next time
        if: hashFiles('.pages-cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .pages-cache
          key: ${{ steps.releases.outputs.key }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
