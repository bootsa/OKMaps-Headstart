name: Pipeline CI

on:
  push:
    branches:
      - "**"
    paths:
      - "packages/pipeline/**"
      - "server/workers/tests/knowncases/**"
      - ".github/workflows/pipeline.yml"

jobs:
  test:
    name: TypeScript pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: packages/pipeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
